# The test gate (spec §31, P8.1): every push and pull request is tested on a real Windows machine. Any failed test or
# restore check fails the run. Free: GitHub Actions minutes are free for public repositories.
# What the gate covers now: clippy, the Rust workspace tests, the desktop and v0 engine tests (the guard test
# harness among them), the cloud Worker tests, the reliability suite and the responsiveness check. The first four
# all run inside the one `npm test` step below; see its comment for why they are not separate steps.
# Not in the gate: the benchmarks (P1.6). `npm run bench` needs 5 GB of free disk for the 1 GB restore cases and
# takes minutes per case on a machine with Defender on (docs/benchmarks.md), and its numbers are only meaningful on
# known hardware, which a shared runner is not. Run it on a real PC and record the result in docs/benchmarks.md.
name: ci
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # Tests' temp folders: on C: with a long path, like users' folders. The runner's own temp folder is an 8.3
      # alias (C:\Users\RUNNER~1\...), which v0 mishandles (docs/known-issues.md), and its D: drive keeps no NTFS
      # change journal, so the change feed's catch-up wouldn't be tested there.
      - name: temp folder on drive C
        shell: bash
        run: |
          mkdir -p /c/mewndo-ci-temp
          printf 'TEMP=C:\\mewndo-ci-temp\nTMP=C:\\mewndo-ci-temp\n' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Rust comes preinstalled with the MSVC toolchain (this PC's local builds use GNU; both get tested).
      - run: rustup component add clippy
      - run: npm ci
      - name: clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      # Each step's output also goes to ci.log; on a failure the last step posts the failing lines as an annotation,
      # which anyone can read without signing in (the full log needs a GitHub login).
      # One step, four suites: `npm test` at the repository root chains
      #   cargo test --manifest-path core/Cargo.toml   every crate in the Rust workspace (core/Cargo.toml is a
      #                                                virtual manifest, so this is mewndo-core and mewndo-proto,
      #                                                unit, integration and doc tests)
      #   npm test -w apps/desktop                     node --test "test/**/*.test.js": the Electron app, the v0
      #                                                engine, and the guard test harness
      #                                                (apps/desktop/test/guard-harness.test.js, P2.6)
      #   npm run test:cloud                           node --test "cloud/*/test/**/*.test.js": the six Workers
      # So the Rust workspace, the guard harness and the cloud Workers are already covered here; adding steps for
      # them would run the same suites twice. The chain is `&&`, so a failure early stops the later suites: read
      # the failure, fix it, push again. The cloud tests need no `npm ci` of their own (they import only node
      # builtins and their own `src/`), which is why there is no install step for cloud/.
      - name: unit tests (core, then the app and v0 engine, then the cloud Workers)
        shell: bash
        run: npm test 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      # The tests that drive a real mewndo-core (the guard harness, restore, store-compat, the change feed, process
      # control) skip themselves when the binary is missing, so a green run could mean they never ran. `cargo test`
      # above builds it, because mewndo-core has integration tests in core/crates/mewndo-core/tests. If it is not
      # there, the step above did not test what it says it did. Same two overrides apps/desktop/test/helpers.js uses.
      - name: the core binary those tests need was built
        shell: bash
        run: test -f "${MEWNDO_CORE_BIN:-${CARGO_TARGET_DIR:-core/target}/debug/mewndo-core.exe}"
      - name: reliability (agent disaster, 5,000-file burst, crash during restore, locked files)
        shell: bash
        run: npm run reliability 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: responsiveness (the real Electron app)
        shell: bash
        run: npm run responsiveness 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: show what failed
        if: failure()
        shell: bash
        run: |
          # node's own summary of failures (with each error), then cargo's and the reliability script's.
          lines=$( (sed -n '/failing tests:/,$p' ci.log; grep -E -A25 'panicked|^error|^ *FAIL|^not ok|✖' ci.log) | head -300 || true)
          # Nothing matched (a crash, a hang, a message in another form): the end of the log says what happened.
          [ -n "$lines" ] || lines=$(tail -n 80 ci.log || echo "ci.log is empty")
          lines=${lines//'%'/%25}
          lines=${lines//$'\r'/}
          echo "::error title=What failed::${lines//$'\n'/%0A}"

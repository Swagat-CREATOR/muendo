# The test gate (spec §31, P8.1): every push and pull request is tested on a real Windows machine. Any failed test or
# restore check fails the run. Free: GitHub Actions minutes are free for public repositories.
# Added when they exist: the guard test harness (P2.6) and the benchmarks (P1.6).
name: ci
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # The runner's own temp folder is an 8.3 short alias (C:\Users\RUNNER~1\...), which users' folders aren't: v0
      # stores a folder by its long real path, so tests that expect the alias back fail there. Known v0 gap, recorded
      # in docs/known-issues.md; the Rust core resolves every root to its long path instead.
      - name: long temp path
        shell: bash
        run: printf 'TEMP=%s\nTMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Rust comes preinstalled with the MSVC toolchain (this PC's local builds use GNU; both get tested).
      - run: rustup component add clippy
      - run: npm ci
      - name: clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      # Each step's output also goes to ci.log; on a failure the last step posts the failing lines as an annotation,
      # which anyone can read without signing in (the full log needs a GitHub login).
      - name: unit tests (core, then the app and v0 engine)
        shell: bash
        run: npm test 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: reliability (agent disaster, 5,000-file burst, crash during restore, locked files)
        shell: bash
        run: npm run reliability 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: responsiveness (the real Electron app)
        shell: bash
        run: npm run responsiveness 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: show what failed
        if: failure()
        shell: bash
        run: |
          # node's own summary of failures (with each error), then cargo's and the reliability script's.
          lines=$( (sed -n '/failing tests:/,$p' ci.log; grep -E -A25 'panicked|^error|^ *FAIL' ci.log) | head -300)
          lines=${lines//'%'/%25}
          lines=${lines//$'\r'/}
          echo "::error title=What failed::${lines//$'\n'/%0A}"

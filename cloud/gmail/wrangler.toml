name = "mewndo-gmail"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Per-user state (tokens + label/trash journal) in a Durable Object (free plan SQLite DO).
[[durable_objects.bindings]]
name = "GMAIL_USER"
class_name = "GmailUser"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GmailUser"]

# Daily watch renewal (Gmail watches expire in 7 days).
[triggers]
crons = ["17 4 * * *"]

# Secrets (NOT stored here): npx wrangler@3 secret put GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
# Optional: Gmail push through Pub/Sub. Put your Google Cloud project id in place of YOUR-PROJECT-ID
# (docs/google-setup.md §5). Left as is, push is off and the app's sync every few minutes does the work.
[vars]
GOOGLE_PUBSUB_TOPIC = "projects/YOUR-PROJECT-ID/topics/mewndo-gmail"

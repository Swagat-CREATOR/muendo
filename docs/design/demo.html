<script>
 // each inline copy needs unique ids for its clip paths
 document.querySelectorAll('svg.mew-face').forEach((s,n)=>{
   s.querySelectorAll('[id]').forEach(e=>{const old=e.id; e.id=old+'-'+n;
     s.querySelectorAll('[clip-path="url(#'+old+')"]').forEach(g=>g.setAttribute('clip-path','url(#'+e.id+')'));});
   s.querySelectorAll('.mew-pupil').forEach(p=>p.id=p.id.replace(/-\d+$/,'')); s.querySelectorAll('.mew-lid').forEach(p=>p.id=p.id.replace(/-\d+$/,''));
 });
 const all=[...document.querySelectorAll('svg.mew-face')].map(s=>MewEyes(s));
 addEventListener('mousemove',e=>all.forEach(x=>x.lookAt(e.clientX,e.clientY)));
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>all.forEach(x=>x.mood(b.dataset.m)));
 document.getElementById('blink').onclick=()=>all.forEach(x=>x.blink());
 window.__mew=all;
</script></body></html>

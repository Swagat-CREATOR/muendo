<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Mewndo bar</title>
  <link rel="stylesheet" href="design/tokens.css">
  <link rel="stylesheet" href="design/base.css">
  <link rel="stylesheet" href="bar.css">
</head>
<body class="float">
  <div id="flyout" class="flyout">
  <section id="box" class="box hit" aria-label="Agents and connections" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-agents" aria-selected="true">Agents</button>
      <button role="tab" id="tab-connections" aria-selected="false">Connections</button>
    </div>
    <div id="list" class="list" role="tabpanel"></div>
    <p class="foot">Only what Mewndo can see on this PC. Solid: exact · outlined: likely · ?: unknown.</p>
  </section>
  <section id="card" class="card hit" role="alertdialog" aria-labelledby="card-tried" hidden>
    <div class="head">
      <svg class="icon warn" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5 18.5 17h-17z"/><path d="M10 8v4M10 14.5v.5"/></svg>
      <p id="card-tried" class="title"></p>
      <button class="close" data-action="card-dismiss" aria-label="Dismiss"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
    </div>
    <p id="card-did" class="body"></p>
    <div class="row">
      <button class="text primary" data-action="card-resume">Resume with corrected brief</button>
      <button class="text" data-action="card-letit">Let it</button>
      <button class="text" data-action="card-stop">Stop and review</button>
    </div>
  </section>
  <section id="ask" class="card ask hit" role="alertdialog" aria-labelledby="ask-text" hidden>
    <div class="head">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2.5"/></svg>
      <p id="ask-text" class="title"></p>
    </div>
    <p id="ask-heard" class="body heard"></p>
    <div id="ask-choices" class="row"></div>
  </section>
  <div id="chips" class="chips"></div>
  <div id="hint" class="hint hit" hidden>
    <div id="keys" class="keys"></div>
    <div class="actions">
      <button id="ticker" class="ticker" data-action="diff" data-long="undo-burst" title="Tap: what changed · Hold: undo it"></button>
      <button class="text" data-action="undo">Undo last</button>
      <button class="text" data-action="brake" id="brake">Brake</button>
      <button class="text" data-action="savepoint">Save point</button>
    </div>
  </div>
  </div>
  <div id="pill" class="pill hit" role="toolbar" aria-label="Mewndo">
    <span id="protection" class="protection face" role="img" aria-label="Mewndo"></span>
    <span id="agents" class="agents"></span>
    <span id="rules-only" class="rules-only" title="Today's decision-model budget is used up. Mewndo's own rules decide until it resets at midnight UTC." hidden>Rules only mode</span>
    <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <button id="mic" class="round" aria-label="Hold to talk" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2.5"/></svg>
    </button>
    <button id="panel" class="round" aria-label="Agents and connections" aria-expanded="false">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg>
    </button>
  </div>
  <script src="design/logos.js"></script>
  <script src="design/mew-eyes.js"></script>
  <script src="bar.js"></script>
</body>
</html>

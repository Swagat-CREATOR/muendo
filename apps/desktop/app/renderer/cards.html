<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Mewndo: Agent Inbox</title>
<style>
  :root { color-scheme: dark; --bg: rgba(22, 24, 32, 0.97); --line: #2c3040; --text: #e8eaf2; --dim: #9aa0b4;
    --accent: #7aa2ff; --amber: #f5b14c; --red: #ff6b6b; --green: #59d48a; }
  html, body { margin: 0; background: transparent; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--text); }
  #stack { display: flex; flex-direction: column; gap: 8px; padding: 8px; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); }
  .card.selected { border-color: var(--accent); }
  .card.answering, .card.sent { opacity: 0.8; }
  .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .kind { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
  .risk { font-size: 11px; color: var(--dim); }
  .risk.r4, .risk.r5 { color: var(--red); }
  .risk.r3 { color: var(--amber); }
  .title { font-weight: 600; margin: 4px 0 2px; word-break: break-word; }
  .line { color: var(--dim); word-break: break-word; }
  .options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  button { font: inherit; color: var(--text); background: #262a38; border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 8px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .hints { margin-top: 6px; font-size: 11px; color: var(--dim); }
  .grace { height: 3px; margin-top: 8px; background: var(--accent); border-radius: 2px; transform-origin: left;
    animation-name: drain; animation-timing-function: linear; animation-fill-mode: forwards; }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  .state { font-size: 11px; color: var(--green); margin-top: 6px; }
  input { width: 100%; box-sizing: border-box; margin-top: 8px; font: inherit; color: var(--text); background: #11131a;
    border: 1px solid var(--accent); border-radius: 6px; padding: 5px 8px; }
  .more { text-align: center; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div id="stack" role="list" aria-label="Agent Inbox"></div>
<script src="cards.js"></script>
</body>
</html>
